<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Library</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256'%3E%3Cpath fill='%230AE448' d='M212,56V88a12,12,0,0,1-24,0V68H140V188h20a12,12,0,0,1,0,24H96a12,12,0,0,1,0-24h20V68H68V88a12,12,0,0,1-24,0V56A12,12,0,0,1,56,44H200A12,12,0,0,1,212,56Z'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://api.fontshare.com">
  <link href="https://api.fontshare.com/v2/css?f[]=switzer@100,200,300,400,500,600,700,800,900,1,2&f[]=general-sans@200,300,400,500,600,700,1,2&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="library-page" data-page="library">

  <header class="library-header">
    <div class="header-inner">
      <div class="brand-group">
        <a href="index.html" class="brand-link">Font Library</a>
        <span class="brand-sep"></span>
        <a href="https://www.instagram.com/bluetigerincstudios/" target="_blank" rel="noopener noreferrer" class="signature-link" aria-label="Ayaan Ahmed Instagram">
          <img src="https://res.cloudinary.com/ayaanahmed/image/upload/v1769144180/ayaan-ahmed-logo_pqauyp.svg" alt="Ayaan Ahmed" class="personal-logo-header">
        </a>
      </div>

      <div class="header-tools">
        <div class="category-tabs" id="categoryTabs">
          <span class="tab-glider" id="tabGlider"></span>
          <button type="button" class="tab-btn active" data-cat="all">All 102</button>
          <button type="button" class="tab-btn" data-cat="variable">Variable</button>
          <button type="button" class="tab-btn" data-cat="sans">Sans</button>
          <button type="button" class="tab-btn" data-cat="display">Display</button>
          <button type="button" class="tab-btn" data-cat="serif">Serif</button>
          <button type="button" class="tab-btn" data-cat="mono">Mono &amp; Pixel</button>
        </div>

        <div class="license-filter" id="licenseFilter">
          <button type="button" class="lic-btn active" data-lic="all">All Licenses</button>
          <button type="button" class="lic-btn" data-lic="open">Open Source / Free</button>
          <button type="button" class="lic-btn" data-lic="restricted">Restricted</button>
        </div>

        <div class="search-field">
          <i class="ph ph-magnifying-glass"></i>
          <input type="search" id="fontSearch" placeholder="Search 102 typefaces..." autocomplete="off">
        </div>
      </div>
    </div>
  </header>

  <main class="index-wrapper">
    <div id="typeIndexList" class="type-index-list"></div>
  </main>

  <footer class="library-footer">
    <div class="footer-inner">
      <a href="https://www.instagram.com/bluetigerincstudios/" target="_blank" rel="noopener noreferrer" class="signature-link">
        <img src="https://res.cloudinary.com/ayaanahmed/image/upload/v1769144180/ayaan-ahmed-logo_pqauyp.svg" alt="Ayaan Ahmed" class="personal-logo-footer">
      </a>
      <span class="footer-meta" id="footerCountMeta">102 Typeface Families &bull; Local Archive</span>
    </div>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
